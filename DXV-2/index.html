<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <form action="" class="khung-form">
        <header class="head-form">
          <h1>ĐƠN XIN VIỆC</h1>
          <p>Nhập thông tin ứng tuyển. CV định dạng PDF</p>
        </header>
        <section class="main-form">
          <div class="grid-form">
            <div class="grid-field">
              <label for="">Họ tên</label>
              <input type="text" placeholder="Nguyễn Văn A" required />
              <small class="hj">Vui lòng nhập họ tên</small>
            </div>
            <div class="grid-field">
              <label for="">Email</label>
              <input type="text" placeholder="email@domain.com" required />
              <small class="hj">Email không hợp lệ</small>
            </div>
            <div class="grid-field">
              <label for="">Số điện thoại</label>
              <input type="text" placeholder="0xxxxxxxxx" required />
              <small class="hj"
                >Số điện thoại phải gồm 10 chữ số và bắt đầu bằng 0.</small
              >
            </div>
            <div class="grid-field">
              <label for="">Giới tính</label>
              <select name="" id="">
                <option value="">Nam</option>
              </select>
            </div>
            <div class="grid-field">
              <label for="">Trình độ</label>
              <select name="" id="">
                <option value="">Cao đẳng</option>
              </select>
            </div>
            <div class="grid-field">
              <label for="">Kinh nghiệm (năm)</label>
              <input type="number" value="40" />
            </div>
          </div>
          <div class="large-form">
            <label for="">Kỹ năng</label>
            <textarea
              name=""
              id=""
              rows="5"
              cols="40"
              placeholder="VD: JavaScript, React, Node, ...">
            </textarea>
          </div>
        </section>
        <div class="foot-form">
          <div class="file">
            <label for="">CV (PDF x 5MB)</label>
            <div class="file-btn">
              <input type="file" class="file-input" />
              <small>chỉ chọn tệp PDF.</small>
              <small class="hj">Vui lòng chọn tệp CV (PDF).</small>
            </div>
          </div>
          <div class="btn-zone">
            <button type="submit">Gửi hồ sơ</button>
            <button type="reset">Làm lại</button>
          </div>
        </div>
      </form>
    </main>
  </body>
</html>
