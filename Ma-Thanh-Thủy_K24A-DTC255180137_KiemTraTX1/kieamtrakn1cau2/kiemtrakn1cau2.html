<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tuyển dụng</title>
  </head>
  <body>
    <form>
      <table
        width="640"
        border="2"
        cellspacing="0"
        cellpadding="7"
        bgcolor="#c9f4f4"
        bordercolor="#8aabab"
        align="center"
      >
        <tr>
          <td colspan="2" height="67" align="center" bgcolor="#f9ffff">
            <font face="Times New Roman" size="6" color="#d71919"
              ><b>Đăng ký tuyển dụng</b></font
            >
          </td>
        </tr>
        <tr>
          <td width="32%"><b>Họ và tên</b></td>
          <td><input type="text" value="Nguyễn Tuấn Anh" size="46" /></td>
        </tr>
        <tr>
          <td><b>Địa chỉ</b></td>
          <td><input type="text" value="Phan Đình Phùng" size="46" /></td>
        </tr>
        <tr>
          <td><b>Điện thoại</b></td>
          <td><input type="tel" value="0983226362" size="46" /></td>
        </tr>
        <tr>
          <td><b>Địa chỉ mail</b></td>
          <td><input type="email" value="haianh@gmail.com" size="46" /></td>
        </tr>
        <tr>
          <td><b>Ảnh chân dung</b></td>
          <td><input type="file" accept="image/*" /></td>
        </tr>
        <tr>
          <td><b>Vị trí tuyển dụng</b></td>
          <td>
            <select>
              <option>Kỹ sư IT</option>
              <option>Lập trình viên</option>
              <option>Nhân viên thiết kế</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><b>Trình độ tiếng Anh</b></td>
          <td>
            <input type="checkbox" /> IELTS&nbsp;&nbsp;
            <input type="checkbox" /> TOEIC&nbsp;&nbsp;
            <input type="checkbox" /> TOEFL
          </td>
        </tr>
        <tr>
          <td><b>Trình độ tiếng Trung</b></td>
          <td>
            <input type="radio" name="chinese" /> A1&nbsp;&nbsp;
            <input type="radio" name="chinese" /> B1&nbsp;&nbsp;
            <input type="radio" name="chinese" /> C1
          </td>
        </tr>
        <tr>
          <td><b>Trình độ</b></td>
          <td>
            <input type="radio" name="education" /> Cử Nhân&nbsp;&nbsp;
            <input type="radio" name="education" /> Đại Học&nbsp;&nbsp;
            <input type="radio" name="education" /> Khác
          </td>
        </tr>
        <tr>
          <td><b>Kinh nghiệm làm việc</b></td>
          <td>
            <textarea
              rows="3"
              cols="44"
              placeholder="Mô tả kinh nghiệm làm việc..."
            ></textarea>
          </td>
        </tr>
        <tr>
          <td colspan="2" align="center"><button type="submit">Lưu</button></td>
        </tr>
      </table>
    </form>
  </body>
</html>
