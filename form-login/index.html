<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="login-form">
      <header>
        <h1 class="login">Login</h1>
        <h4 class="subtitle">Please login your account !</h4>
      </header>

      <main>
        <div class="group-form">
          <lable class="lable-form" for="email">
            Email/number
            <br />
          </lable>
          <input
            class="input-form"
            id="email"
            type="text"
            placeholder="Email or number"
          />
        </div>

        <div class="group-form">
          <lable class="lable-form" for="password">
            Password
            <br />
          </lable>
          <input
            class="input-form"
            id="password"
            type="password"
            placeholder="*******"
          />
        </div>

        <div class="group-form">
          <button class="submit-btn" type="submit">Login</button>
        </div>
      </main>
    </div>
  </body>
</html>
