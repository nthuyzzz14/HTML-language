<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table - Colgroup</title>
    <link rel="icon" type="x-icon" href="./img/simple-table.svg" />
  </head>
  <body>
    <table>
      <colgroup>
        <col span="1" style="background-color: pink" />
        <col span="2" style="background-color: lightgreen" />
        <col span="3" style="background-color: red" />
        <col span="1" style="background-color: lightseagreen" />
      </colgroup>
      <tr>
        <th>MON</th>
        <th>TUE</th>
        <th>WEN</th>
        <th>THUR</th>
        <th>FRI</th>
        <th>SAT</th>
        <th>SUN</th>
      </tr>
      <tr>
        <td>2</td>
        <td>3</td>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td>7</td>
        <td>8</td>
      </tr>
      <tr>
        <td>9</td>
        <td>10</td>
        <td>11</td>
        <td>12</td>
        <td>13</td>
        <td>14</td>
        <td>15</td>
      </tr>
    </table>
  </body>
</html>
