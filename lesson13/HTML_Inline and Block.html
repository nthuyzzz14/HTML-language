<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML - INLINE-BLOCK</title>
  </head>
  <body>
    <h3>Block</h3>
    <div style="width: 500px; height: 10px">
      These many things in the workplace
    </div>
    <p style="width: 100px">I try to learn Chinese</p>
    <hr />

    <h3>Inline</h3>
    <span style="width: 250px">This is the paragraph to display </span>
    <strong>This also to display the paragraph of block</strong>
    <hr />

    <h3>Inline-Block</h3>
    <span style="display: inline-block; width: 230px">
      mathanhthuy width:230px</span
    >
  </body>
</html>
