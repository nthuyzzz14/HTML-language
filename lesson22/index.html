<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input THU THAP DATA</title>
  </head>
  <body>
    <div>
      <label for="username" method="get">Username:</label>
      <input
        type="text"
        id="username"
        name="fullname"
        class="input"
        placeholder="Enter your name"
        value="mathanhthuy"
        disabled
      />
    </div>

    <div>
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        class="email"
        placeholder="example@mail.com"
        required
      />
    </div>

    <div>
      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        class="password"
        placeholder="Your password"
      />
    </div>

    <div>
      <label for="date">Date of birth:</label>
      <input type="date" id="date" name="date" class="date" />
    </div>

    <div>
      <label for="color">Color:</label>
      <input type="color" id="color" name="color" class="color" />
    </div>

    <div>
      <button type="submit" name="submit">Register</button>
    </div>
  </body>
</html>
