<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHECKBOX - RADIO</title>
  </head>
  <body>
    <div>
      <label>
        Gender:
        <br />
      </label>

      <input type="radio" name="gender" value="male" checked />Male
      <br />

      <input type="radio" name="gender" value="female" /> Female
      <br />

      <input type="radio" name="gender" value="other" />Other
    </div>

    <div>
      <label> Hobbies: </label>
      <br />

      <input type="checkbox" name="hobby" value="sport" />The thao
      <br />

      <input type="checkbox" name="hobby" value="reading" />Doc sach
      <br />

      <input type="checkbox" name="hobby" value="music" />Am nhac
    </div>
  </body>
</html>
