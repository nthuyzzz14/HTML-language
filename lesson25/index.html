<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM - VALIDATION</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <div class="log-in-group">
        <div class="avt">
          <img src="" />
        </div>

        <label class="label-form" for="name"> Họ Tên: </label>
        <br />
        <input
          id="name"
          type="text"
          class="input-form"
          name="name"
          placeholder="Your name ..."
        />

        <br />
        <label for="email" class="label-form"> Email: </label>
        <br />
        <input
          id="email"
          type="email"
          class="input-form"
          name="email"
          placeholder="example@mail.com"
          required
        />
        <br />

        <label for="password" class="label-form"> Mật Khẩu: </label>
        <br />
        <input
          id="pasword"
          type="password"
          class="input-form"
          name="password"
          placeholder="*******"
          minlength="6"
          required
        />
        <br />

        <label for="tuoi" class="label-form"> Tuổi: </label>
        <br />
        <input
          id="tuoi"
          type="number"
          name="tuoi"
          class="input-form"
          placeholder="Age"
          min="18"
          max="40"
          required
        />

        <br />
        <button type="submit" class="btn">Create</button>
        <button type="reset" class="btn">Reset</button>
      </div>
    </form>
  </body>
</html>
