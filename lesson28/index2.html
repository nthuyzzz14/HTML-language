<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Time-local</title>
  </head>
  <body>
    <header>
      <h2>Ma thanh thuy</h2>
    </header>

    <div>
      <label> thoi gian: </label>
      <br />
      <input
        type="datetime-local"
        name="date"
        min="1998-08-12"
        max="2026-08-14"
        required
      />
      <br />

      <input type="tel" />
      <input type="month" />
      <br />
      <input type="hidden" />
      <br />
      <button type="submit">Confirm</button>
    </div>
  </body>
</html>
