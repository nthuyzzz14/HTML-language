<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAT BAN NHA HANG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <form action="" class="khung-form">
        <header class="head-content">
          <div class="rest-name">
            <h1>🍽️ ĐẶT BÀN NHÀ HÀNG</h1>
            <p>
              Khung giờ phục vụ <span>10:00 - 22:00.</span> Vui lòng chọn giờ
              trong khoảng này
            </p>
          </div>
        </header>
        <div class="dishes">
          <ul>
            <li>🍜Phở Bò</li>
            <li>🍚Cơm Tấm</li>
            <li>🍲Lẩu Thái</li>
            <li>🦐Hải Sản</li>
          </ul>
        </div>
        <section class="main-content">
          <div class="grid-content">
            <div class="content">
              <label for="">Họ tên</label>
              <input type="text" placeholder="Nguyễn Văn A" required />
            </div>
            <div class="content">
              <label for="">Điện thoại</label>
              <input type="text" placeholder="0xxxxxxxxx" required />
              <small>Định dạng: 10 số, bắt đầu bằng số <span>0.</span></small>
            </div>
            <div class="content">
              <label for="">Ngày</label>
              <input type="date" required />
            </div>
            <div class="content">
              <label for="">Giờ</label>
              <input type="time" />
            </div>
            <div class="content">
              <label for="">Số khách</label>
              <input type="text" value="2" />
            </div>
            <div class="content">
              <label for="">Vị trị bàn</label>
              <select name="" id="">
                <option value="">Cửa sổ</option>
              </select>
            </div>
          </div>
          <div class="btn">
            <button>Đặt bàn</button>
          </div>
        </section>
      </form>
    </main>
  </body>
</html>
