<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DANG KY KHOA HOC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="form-shell">
        <header class="title-form">
          <h1>🎓ĐẲNG KÝ KHOÁ HỌC</h1>
          <div class="all-languages">
            <div class="language">
              <p>HTML & CSS</p>
            </div>
            <div class="language">
              <p>JavaScript</p>
            </div>
            <div class="language">
              <p>Python</p>
            </div>
            <div class="language">
              <p>Ai/ML</p>
            </div>
          </div>
        </header>
        <form action="#" class="main-form">
          <div class="grid-sign-up">
            <div class="fiel">
              <label>Họ tên <span>*</span></label>
              <input type="text" placeholder="Nguyễn Văn A " required />
            </div>
            <div class="fiel">
              <label> Email <span>*</span></label>

              <input type="text" required placeholder="email@domain.com" />
            </div>
            <div class="fiel">
              <label>Điện thoai</label>
              <input type="text" placeholder="0xxxxxxxxxx" min="10" required />
              <small>Định dạng: 0 -> 9 chữ số (ví dụ: 0912345678)</small>
            </div>
            <div class="fiel">
              <label>Cơ sở học</label>
              <select>
                <option>Hà Nội</option>
              </select>
            </div>
            <div class="large-fiel">
              <label for="#">Mục tiêu học tập</label>
              <textarea
                name="#"
                id="#"
                placeholder="Đạt kỳ vọng gì trong khoá học này ?"
                rows="5"></textarea>
            </div>
          </div>
          <!-- THông báo về học phí khoá học -->
          <div class="alert-cost">
            <p>Học phí tham khảo: 2.500.000 - 8.000.000đ (tuỳ khoá)</p>
          </div>
          <!-- Khu vực nút báam -->
          <div class="btn-zone">
            <div class="btn">
              <button type="submit" class="active">Đăng ký</button>
            </div>
            <div class="btn">
              <button type="submit">Làm lại</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
